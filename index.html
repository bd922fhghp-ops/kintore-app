<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="筋トレ記録">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#111111">
<title>筋トレ記録</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#0b0b0c;color:#f5f5f7}
main{max-width:560px;margin:auto;padding:18px 16px 90px}
h1{font-size:28px;margin:8px 0 20px}
h2{font-size:18px;margin:0 0 14px}
.card{background:#171719;border:1px solid #29292d;border-radius:18px;padding:16px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:13px;color:#aaa;margin:0 0 6px}
input,select,button{width:100%;font:inherit;border-radius:12px;border:1px solid #34343a}
input,select{background:#222226;color:#fff;padding:13px}
button{padding:14px;background:#f5f5f7;color:#111;font-weight:700;border:0}
button.secondary{background:#29292d;color:#fff}
button.danger{background:transparent;color:#ff7b7b;border:1px solid #5b3030}
.row{display:flex;gap:10px}.row>*{flex:1}
.muted{color:#9b9ba2;font-size:13px}
.prev{margin-top:10px;padding:10px 12px;background:#202023;border-radius:12px;font-size:14px}
.entry{padding:12px 0;border-top:1px solid #2b2b30}
.entry:first-child{border-top:0}
.entry strong{font-size:16px}
.entry .meta{color:#aaa;font-size:13px;margin-top:4px}
.tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(15,15,16,.94);backdrop-filter:blur(12px);border-top:1px solid #29292d;display:flex;padding:8px max(12px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
.tabs button{background:transparent;color:#aaa;padding:10px}.tabs button.active{color:#fff;background:#29292d}
.page{display:none}.page.active{display:block}
#chart{width:100%;height:160px;background:#111;border-radius:12px}
.empty{color:#777;text-align:center;padding:18px}
.setrow{display:grid;grid-template-columns:42px 1fr 1fr 42px;gap:8px;align-items:end;margin-bottom:10px}
.setno{height:48px;display:flex;align-items:center;justify-content:center;color:#aaa;font-weight:700}
.setrow button.remove{height:48px;padding:0;background:#29292d;color:#bbb;font-size:20px}
.setrow .field label{margin-bottom:5px}
</style>
</head>
<body>
<main>
<h1>筋トレ記録</h1>

<section id="record" class="page active">
  <div class="card">
    <h2>今日の体重</h2>
    <div class="row">
      <input id="weight" type="number" inputmode="decimal" step="0.1" placeholder="例 62.5">
      <button onclick="saveWeight()">記録</button>
    </div>
    <div id="lastWeight" class="muted" style="margin-top:10px"></div>
  </div>

  <div class="card">
    <h2>トレーニング</h2>
    <label>種目</label>
    <input id="exercise" list="exerciseList" placeholder="例 ベンチプレス" oninput="showPrevious()">
    <datalist id="exerciseList"></datalist>
    <div id="previous"></div>
    <div id="setInputs" style="margin-top:12px"></div>
    <button class="secondary" style="margin-top:10px" onclick="addSet()">＋ セット追加</button>
    <div style="margin-top:12px"><label>日付</label><input id="date" type="date"></div>
    <button style="margin-top:14px" onclick="saveWorkout()">記録する</button>
  </div>
</section>

<section id="history" class="page">
  <div class="card"><h2>トレーニング履歴</h2><div id="historyList"></div></div>
</section>

<section id="bodyweight" class="page">
  <div class="card">
    <h2>体重の推移</h2>
    <canvas id="chart" width="500" height="180"></canvas>
    <div id="weightList" style="margin-top:12px"></div>
  </div>
</section>
</main>

<nav class="tabs">
<button class="active" onclick="tab('record',this)">記録</button>
<button onclick="tab('history',this)">履歴</button>
<button onclick="tab('bodyweight',this)">体重</button>
</nav>

<script>
const WKEY='simpleGymWorkoutsV1', BKEY='simpleGymWeightV1';
const $=id=>document.getElementById(id);
const today=()=>new Date().toLocaleDateString('sv-SE');
$('date').value=today();

function load(k){try{return JSON.parse(localStorage.getItem(k))||[]}catch{return[]}}
function store(k,v){localStorage.setItem(k,JSON.stringify(v))}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

let setCount=0;
function addSet(kg='',reps=''){
 setCount++;
 const row=document.createElement('div');
 row.className='setrow';
 row.innerHTML=`<div class="setno">${setCount}</div>
   <div class="field"><label>重量 kg</label><input class="setkg" type="number" inputmode="decimal" step="0.5" placeholder="40" value="${kg}"></div>
   <div class="field"><label>回数</label><input class="setreps" type="number" inputmode="numeric" placeholder="10" value="${reps}"></div>
   <button class="remove" type="button" onclick="removeSet(this)">×</button>`;
 $('setInputs').appendChild(row);
 renumberSets();
}
function removeSet(btn){
 if(document.querySelectorAll('.setrow').length<=1){alert('1セットは残してね');return}
 btn.closest('.setrow').remove(); renumberSets();
}
function renumberSets(){
 document.querySelectorAll('.setrow').forEach((r,i)=>r.querySelector('.setno').textContent=i+1);
 setCount=document.querySelectorAll('.setrow').length;
}
function resetSets(){
 $('setInputs').innerHTML=''; setCount=0;
 addSet(); addSet(); addSet();
}
function saveWorkout(){
 const ex=$('exercise').value.trim(), date=$('date').value||today();
 const rows=[...document.querySelectorAll('.setrow')];
 const sets=rows.map(r=>({kg:r.querySelector('.setkg').value,reps:r.querySelector('.setreps').value}));
 if(!ex){alert('種目を入力してね');return}
 if(!sets.length||sets.some(s=>s.kg===''||s.reps==='')){alert('各セットの重量と回数を入力してね');return}
 const cleanSets=sets.map(s=>({kg:Number(s.kg),reps:Number(s.reps)}));
 let a=load(WKEY); a.unshift({id:Date.now(),date,ex,setsData:cleanSets}); store(WKEY,a);
 resetSets(); render(); showPrevious(); alert('記録したよ');
}
function saveWeight(){
 const v=$('weight').value;
 if(v===''){alert('体重を入力してね');return}
 let a=load(BKEY); const d=today(); a=a.filter(x=>x.date!==d); a.push({id:Date.now(),date:d,weight:Number(v)}); a.sort((x,y)=>x.date.localeCompare(y.date)); store(BKEY,a);
 $('weight').value=''; render(); alert('体重を記録したよ');
}
function delWorkout(id){if(confirm('この記録を削除する？')){store(WKEY,load(WKEY).filter(x=>x.id!==id));render()}}
function delWeight(id){if(confirm('この体重記録を削除する？')){store(BKEY,load(BKEY).filter(x=>x.id!==id));render()}}

function workoutText(x){
 if(Array.isArray(x.setsData)){
   return x.setsData.map((s,i)=>`${i+1}セット目 ${s.kg}kg × ${s.reps}回`).join(' / ');
 }
 return `${x.kg}kg × ${x.reps}回 × ${x.sets}セット`;
}
function showPrevious(){
 const ex=$('exercise').value.trim(); const p=load(WKEY).find(x=>x.ex===ex);
 $('previous').innerHTML=p?`<div class="prev">前回：${esc(p.date)}<br><b>${workoutText(p)}</b></div>`:'';
}
function render(){
 const w=load(WKEY);
 $('historyList').innerHTML=w.length?w.map(x=>`<div class="entry"><strong>${esc(x.ex)}</strong><div class="meta">${esc(x.date)}<br>${workoutText(x)}</div><button class="danger" style="margin-top:8px;padding:8px" onclick="delWorkout(${x.id})">削除</button></div>`).join(''):'<div class="empty">まだ記録がありません</div>';
 const names=[...new Set(w.map(x=>x.ex))];
 $('exerciseList').innerHTML=names.map(n=>`<option value="${esc(n)}">`).join('');

 const b=load(BKEY);
 const last=b[b.length-1];
 $('lastWeight').textContent=last?`最新：${last.date}　${last.weight}kg`:'まだ体重記録はありません';
 $('weightList').innerHTML=b.length?[...b].reverse().map(x=>`<div class="entry"><strong>${x.weight} kg</strong><div class="meta">${x.date}</div><button class="danger" style="margin-top:8px;padding:8px" onclick="delWeight(${x.id})">削除</button></div>`).join(''):'<div class="empty">まだ記録がありません</div>';
 drawChart(b);
}
function drawChart(a){
 const c=$('chart'),ctx=c.getContext('2d'),dpr=devicePixelRatio||1;
 const rect=c.getBoundingClientRect(); c.width=rect.width*dpr;c.height=160*dpr;ctx.scale(dpr,dpr);
 const W=rect.width,H=160;ctx.clearRect(0,0,W,H);
 if(a.length<2){ctx.fillStyle='#777';ctx.font='14px sans-serif';ctx.textAlign='center';ctx.fillText('2回以上記録するとグラフが出ます',W/2,H/2);return}
 const vals=a.map(x=>x.weight), min=Math.min(...vals)-1,max=Math.max(...vals)+1,p=18;
 ctx.strokeStyle='#888';ctx.lineWidth=2;ctx.beginPath();
 a.forEach((x,i)=>{const X=p+i*(W-2*p)/(a.length-1),Y=H-p-(x.weight-min)*(H-2*p)/(max-min);i?ctx.lineTo(X,Y):ctx.moveTo(X,Y)});
 ctx.stroke();
 a.forEach((x,i)=>{const X=p+i*(W-2*p)/(a.length-1),Y=H-p-(x.weight-min)*(H-2*p)/(max-min);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(X,Y,3,0,Math.PI*2);ctx.fill()});
}
function tab(id,btn){
 document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');
 document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');if(id==='bodyweight')setTimeout(render,20);
}
window.addEventListener('resize',()=>drawChart(load(BKEY)));
resetSets();
render();
</script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');</script>
</body>
</html>
